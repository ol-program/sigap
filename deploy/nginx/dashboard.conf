# Dashboard utama (frontend/) -- role admin & pmo. Cuma serve static
# dist/ -- pemanggilan API langsung ke domain terpisah di api.conf (frontend
# pakai VITE_API_BASE_URL full-origin + CORS, lihat frontend/src/api.js dan
# backend CORS_ORIGINS -- BUKAN reverse-proxy path /api/ di server yang sama).
#
# Install: ganti REPLACE_WITH_DASHBOARD_DOMAIN di bawah (mis. kalau belum
# ada domain, pakai sslip.io: dash.<IP-VPS-dengan-tanda-hubung>.sslip.io --
# contoh IP 203.0.113.10 -> dash.203-0-113-10.sslip.io, resolve otomatis
# ke IP itu tanpa perlu beli domain). Domain yang sama ini juga yang
# dipakai sebagai salah satu origin di backend/.env.production (CORS_ORIGINS).
#
#   sudo cp deploy/nginx/dashboard.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/dashboard.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d REPLACE_WITH_DASHBOARD_DOMAIN   # nambahin blok SSL otomatis

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_DASHBOARD_DOMAIN;

    root /opt/sigap-kopdes/frontend/dist;
    index index.html;

    # SPA (React Router) -- fallback semua path ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
