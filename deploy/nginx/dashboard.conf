# Dashboard utama (frontend/) -- role admin & pmo. Cuma serve static
# dist/ -- pemanggilan API langsung ke domain terpisah di api.conf (frontend
# pakai VITE_API_BASE_URL full-origin + CORS, lihat frontend/src/api.js dan
# backend CORS_ORIGINS -- BUKAN reverse-proxy path /api/ di server yang sama).
#
# Install: ganti sigapkopdes.duckdns.org di bawah kalau domain DuckDNS-nya
# beda. Domain yang sama ini juga yang dipakai sebagai salah satu origin di
# backend/.env.production (CORS_ORIGINS).
#
#   cp deploy/nginx/dashboard.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/dashboard.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d sigapkopdes.duckdns.org   # nambahin blok SSL otomatis

server {
    listen 80;
    listen [::]:80;
    server_name sigapkopdes.duckdns.org;

    root /opt/sigap-kopdes/frontend/dist;
    index index.html;

    # SPA (React Router) -- fallback semua path ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
