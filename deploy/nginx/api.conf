# Backend API (uvicorn, listen 127.0.0.1:8000 lewat systemd unit) -- domain
# terpisah sendiri (bukan path /api/ di bawah dashboard/admin) supaya cocok
# dengan arsitektur CORS full-origin yang sudah ada di kode (frontend pakai
# VITE_API_BASE_URL sebagai origin penuh, lihat frontend/src/api.js dan
# backend CORS_ORIGINS di backend/.env.production).
#
# Install: ganti api.109-105-194-204.sslip.io (mis. api.<IP-dengan-tanda-hubung>.sslip.io).
# Domain ini yang dipakai sebagai VITE_API_BASE_URL saat build kedua frontend.
#
#   cp deploy/nginx/api.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/api.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.109-105-194-204.sslip.io

server {
    listen 80;
    listen [::]:80;
    server_name api.109-105-194-204.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI insight on-demand (step 5) didokumentasikan 2-15 detik di README,
        # TAPI di produksi (Gemini tier gratis) pernah kejadian nyata makan
        # hampir 4 MENIT saat API sedang throttle/rate-limit -- 30s ternyata
        # jauh kurang, nginx keburu nyerah (browser lihat "Failed to fetch")
        # padahal backend-nya sendiri tetap selesai & tersimpan di belakang
        # layar. Dinaikkan jauh lebih longgar sebagai buffer.
        proxy_read_timeout 120s;
    }
}
