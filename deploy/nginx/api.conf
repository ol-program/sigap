# Backend API (uvicorn, listen 127.0.0.1:8000 lewat systemd unit) -- domain
# terpisah sendiri (bukan path /api/ di bawah dashboard/admin) supaya cocok
# dengan arsitektur CORS full-origin yang sudah ada di kode (frontend pakai
# VITE_API_BASE_URL sebagai origin penuh, lihat frontend/src/api.js dan
# backend CORS_ORIGINS di backend/.env.production).
#
# Install: ganti REPLACE_WITH_API_DOMAIN (mis. api.<IP-dengan-tanda-hubung>.sslip.io).
# Domain ini yang dipakai sebagai VITE_API_BASE_URL saat build kedua frontend.
#
#   sudo cp deploy/nginx/api.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d REPLACE_WITH_API_DOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_API_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI insight on-demand (step 5) bisa makan 2-15 detik (lihat README) --
        # jangan timeout duluan di proxy sebelum backend selesai.
        proxy_read_timeout 30s;
    }
}
