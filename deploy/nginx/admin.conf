# Portal superadmin (frontend-admin/) -- manajemen akun, TERPISAH dari
# dashboard.conf, ditaruh di subdomain sendiri yang tidak ditautkan dari
# mana pun (lihat README bagian "Portal Superadmin").
#
# Install: ganti REPLACE_WITH_ADMIN_DOMAIN (mis. admin.<IP-dengan-tanda-hubung>.sslip.io).
#
#   sudo cp deploy/nginx/admin.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/admin.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d REPLACE_WITH_ADMIN_DOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_ADMIN_DOMAIN;

    root /opt/sigap-kopdes/frontend-admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
