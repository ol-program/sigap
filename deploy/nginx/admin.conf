# Portal superadmin (frontend-admin/) -- manajemen akun, TERPISAH dari
# dashboard.conf, ditaruh di subdomain sendiri yang tidak ditautkan dari
# mana pun (lihat README bagian "Portal Superadmin").
#
# Install: ganti admin.109-105-194-204.sslip.io (mis. admin.<IP-dengan-tanda-hubung>.sslip.io).
#
#   cp deploy/nginx/admin.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/admin.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d admin.109-105-194-204.sslip.io

server {
    listen 80;
    listen [::]:80;
    server_name admin.109-105-194-204.sslip.io;

    root /opt/sigap-kopdes/frontend-admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
